name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: "Runtime versions (tzdata matters: BC permanent UTC-7)"
        run: |
          node -p "JSON.stringify({node: process.version, tz: process.versions.tz, icu: process.versions.icu})"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CSV import dry run (sample)
        run: |
          npx tsx scripts/import-csv.ts --file data/samples/curated_sample.csv --now 2026-10-10T12:00:00Z > import-report.json
          node -e "const r=require('./import-report.json').run; console.log(r); if (r.accepted_count!==7||r.rejected_count!==7) process.exit(1)"
      - name: Secret hygiene (no keys committed)
        run: |
          if git grep -nE '(service_role|SERVICE_ROLE_KEY)\s*[:=]\s*["'"'"']?eyJ|sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!.github/workflows/ci.yml'; then
            echo "Possible secret committed"; exit 1
          fi
